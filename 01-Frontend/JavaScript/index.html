<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h2 id="hello">안녕하세요</h2>

     <!-- 웹에 존재하는 UI 종료 : 모달, Alert, 탭, 툴팁, 서브메뉴, 경고문, 캐러셀 등등 -->
     <!-- UI만들 때는 미리 디자인해놓고 숨기겨서 버튼 누르거나 할 때 보여준다 -->
     <!-- Alert -->

    <div class="alert-box" id="alert">
        <p>Alert box</p>

        <!-- 긴 코드를 함수로 축약해서 사용해서 사용할 수 있다 -->
        <button onclick="document.getElementById('alert').style.display = 'none'">닫기</button>
    </div> 
    <!-- 모든 HTML 태그에는 onclick 속성을 부여할 수 있는데, 이는 해당 요소를 클릭했을 시 안에 있는 자바스크립트 명령어를 실행하라는 의미이다 -->
    <button onclick="func_test('block')">열기</button>

    <!-- 자바스크립트로 html 조작하는 방법 -->
    <script>
        
        // 문서에서 'hello' id를 갖는 요소를 가져와 내부 글자를 '안녕' 으로 바꾼다
        document.getElementById('hello').innerHTML = '안녕';
        // document.getElementById('???').??? = ???;  -> ???에 바꿀 요소를 대입한다

        document.getElementById('hello').style.fontSize = '30px';
        
        // 함수 문법
        function func_test(arg){
            document.getElementById('alert').style.display = arg;
        } 

        
    </script>
</body>
</html>
